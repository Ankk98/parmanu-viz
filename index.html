<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>parmanu-viz</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="file-panel">
    <h1>parmanu-viz</h1>
    <p class="subtitle">Desktop: open via http://localhost or GitHub Pages. VR: Quest Browser + HTTPS only.</p>

    <label class="dataset-label">
      Dataset
      <select id="dataset-select" aria-label="Dataset type">
        <option value="kitti" selected>KITTI Object</option>
      </select>
    </label>
    <p id="file-hint" class="file-hint"></p>

    <div id="file-inputs">
      <div id="file-panel-kitti" class="dataset-file-panel">
        <label>
          Point cloud (.bin)
          <input type="file" id="kitti-pointcloud" accept=".bin">
        </label>
        <label>
          Labels (label_2 .txt)
          <input type="file" id="kitti-label" accept=".txt">
        </label>
        <label>
          Calibration (.txt)
          <input type="file" id="kitti-calib" accept=".txt">
        </label>
      </div>
      <div id="file-panel-sit" class="dataset-file-panel" hidden>
        <label>
          Point cloud (.pcd, velo/concat)
          <input type="file" id="sit-pointcloud" accept=".pcd">
        </label>
        <label>
          Labels (label_3d .txt) — optional
          <input type="file" id="sit-label" accept=".txt">
        </label>
        <label>
          Ego trajectory (.txt) — optional if skipping transform
          <input type="file" id="sit-ego" accept=".txt">
        </label>
        <label class="sit-skip-ego">
          <input type="checkbox" id="sit-skip-ego">
          Skip ego (raw xyz + yaw flip only; default uses official viz transform)
        </label>
      </div>
    </div>

    <div class="panel-actions">
      <button type="button" id="btn-visualize" disabled>Visualize</button>
      <button type="button" id="btn-sensor-pov" disabled title="Orbit LiDAR origin, looking along +X (sensor front)">Sensor POV</button>
      <button type="button" id="btn-overview" disabled title="Orbit scene center">Overview</button>
      <button type="button" id="btn-reset-view" disabled title="Reset to default view">Reset view</button>
    </div>
  </div>

  <div id="container"></div>

  <div id="hud">
    <div><strong>Controls</strong></div>
    <div>Drag: orbit · Scroll: zoom · Right-drag: pan</div>
    <div>O: sensor POV · V: overview · R: reset view</div>
    <div>Orange arrow at origin = sensor front (+X)</div>
    <div id="xr-status"><strong>WebXR:</strong> checking…</div>
  </div>

  <div id="status">Select a dataset and files, then Visualize</div>
  <div id="legend"></div>

  <script src="assets/three.min.js"></script>
  <script src="assets/OrbitControls.js"></script>
  <script src="assets/PCDLoader.js"></script>
  <script src="assets/VRButton.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/vr.js"></script>
  <script src="js/datasets/registry.js"></script>
  <script src="js/explorer.js"></script>
  <script src="js/datasets/kitti.js"></script>
  <script src="js/datasets/sit.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
