<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>parmanu-viz — KITTI</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/three.module.js",
      "three/addons/": "./assets/"
    }
  }
  </script>
</head>
<body>
  <div id="file-panel">
    <h1>parmanu-viz</h1>
    <p class="subtitle">KITTI frame viewer (desktop v1)</p>
    <label>
      Point cloud (.bin)
      <input type="file" id="file-bin" accept=".bin">
    </label>
    <label>
      Labels (label_2 .txt)
      <input type="file" id="file-label" accept=".txt">
    </label>
    <label>
      Calibration (.txt)
      <input type="file" id="file-calib" accept=".txt">
    </label>
    <div class="panel-actions">
      <button type="button" id="btn-visualize" disabled>Visualize</button>
      <button type="button" id="btn-reset-view" disabled>Reset view</button>
    </div>
  </div>

  <div id="container"></div>

  <div id="hud">
    <div><strong>Controls</strong></div>
    <div>Drag: orbit · Scroll: zoom · Right-drag: pan</div>
    <div>R: reset view</div>
  </div>

  <div id="status">Select three files, then Visualize</div>
  <div id="legend"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
